name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend (vitest + eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm test
      - run: npm run build

  contract-drift:
    name: Contract drift (OpenAPI vs frontend types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -c "import json; from api import app; json.dump(app.openapi(), open('openapi.json', 'w'))"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npx openapi-typescript@latest ../openapi.json -o /tmp/schema-fresh.d.ts
        working-directory: frontend
      - name: Check for drift
        run: |
          if ! diff -u frontend/src/api/schema.d.ts /tmp/schema-fresh.d.ts; then
            echo ""
            echo "::error::frontend/src/api/schema.d.ts is out of date with the backend's OpenAPI schema."
            echo "Run 'npm run gen:api' locally (with the backend dev server running) and commit the regenerated file."
            exit 1
          fi
