name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: FinanceCalculator-windows.exe
            artifact: dist/FinanceCalculator.exe
          - os: ubuntu-latest
            asset: FinanceCalculator-linux
            artifact: dist/FinanceCalculator
          - os: macos-latest
            asset: FinanceCalculator-macos
            artifact: dist/FinanceCalculator
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build executable
        run: python build.py --clean

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.artifact }}" "out/${{ matrix.asset }}"
          cp version.txt "out/version.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/${{ matrix.asset }}
            out/version.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
