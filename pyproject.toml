[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() as default arguments is the framework's own
# documented DI idiom, not the mutable-default-argument bug B008 targets.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.coverage.run]
source = ["api", "calculator", "database", "models", "config", "prod_calendar", "core", "modules"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["api", "calculator", "database", "models", "config", "prod_calendar", "core", "modules"]
