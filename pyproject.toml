[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["calculator", "db", "models", "config", "prod_calendar", "services", "updater", "paths", "gui", "core", "modules"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["calculator", "db", "models", "config", "prod_calendar", "services", "updater", "paths", "gui", "core", "modules"]
