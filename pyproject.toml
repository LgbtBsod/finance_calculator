[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() as default arguments is the framework's own
# documented DI idiom, not the mutable-default-argument bug B008 targets.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.coverage.run]
source = ["api", "calculator", "database", "models", "config", "prod_calendar"]
omit = ["tests/*"]
